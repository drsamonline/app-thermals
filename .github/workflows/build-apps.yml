# Build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# The whole pipeline lives in the public app-builder kit, so a fix there reaches
# every app at once. Do not inline it here again.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  app:
    uses: drsamonline/app-builder/.github/workflows/build.yml@0c12b67b888b9caa0aeaed61a7268dc9dfbb7660
    with:
      app_name: app-thermals
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      id-token: write
